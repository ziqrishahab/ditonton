workflows:
  default-workflow:
    name: Flutter CI
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Flutter Analyze
        script: flutter analyze --no-fatal-infos

      - name: Flutter Test
        script: flutter test

      - name: Build Android Debug
        script: flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
